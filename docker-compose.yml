version: '3.8'

services:

  # ══════════════════════════════
  # NEO4J
  # ══════════════════════════════
  neo4j:
    image: neo4j:5.15
    container_name: neo4j_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

  neo4j_app:
    image: python:3.11-slim
    container_name: neo4j_app
    depends_on:
      - neo4j
    volumes:
      - ./neo4j:/app
    working_dir: /app
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    command: >
      bash -c "sleep 25 && pip install neo4j -q && python neo4j_app.py"

  # ══════════════════════════════
  # MONGODB
  # ══════════════════════════════
  mongodb:
    image: mongo:7.0
    container_name: mongodb_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo_app:
    image: python:3.11-slim
    container_name: mongo_app
    depends_on:
      - mongodb
    volumes:
      - ./mongodb:/app
    working_dir: /app
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    command: >
      bash -c "sleep 10 && pip install pymongo -q && python mongodb.py"

  # ══════════════════════════════
  # CASSANDRA
  # ══════════════════════════════
  cassandra:
    image: cassandra:4.1
    container_name: cassandra_db
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=university_cluster
      - HEAP_NEWSIZE=256M
      - MAX_HEAP_SIZE=1G
    volumes:
      - cassandra_data:/var/lib/cassandra

  cassandra_app:
    image: python:3.11-slim
    container_name: cassandra_app
    depends_on:
      - cassandra
    volumes:
      - ./cassandra:/app
    working_dir: /app
    environment:
      - CASSANDRA_HOST=cassandra
    command: >
      bash -c "sleep 90 && pip install cassandra-driver -q && python cassandra_app.py"

volumes:
  neo4j_data:
  mongo_data:
  cassandra_data: